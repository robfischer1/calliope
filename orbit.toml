# Each edge names a contract, foundry-dies/orbits/<contract>.toml, by name,
# version and sha256 of its bytes. The verbs live in the contract.
# [[produces]] is who breaks if calliope changes what it SERVES; [[consumes]] is
# what calliope breaks if it changes how it CALLS. To change a seam, edit the
# contract in a foundry-dies pull (orbits/README.md says how), then re-lay.

